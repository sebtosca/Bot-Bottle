[pytest]
# Pytest configuration for BotBottle endpoint tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = 
    endpoint/tests
    endpoint/webhook/tests
    endpoint/security/tests
    endpoint/middleware/tests
    endpoint/routes/tests
    endpoint/helpers/tests
    llm/tests
    models/tests
    services/whatsapp/tests
    core/tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=endpoint
    --cov=llm
    --cov=models
    --cov=services
    --cov=core
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-fail-under=80
    --maxfail=5
    -p no:warnings

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated, mocked)
    integration: Integration tests (real components)
    e2e: End-to-end tests (full flow)
    slow: Tests that take longer than 1 second
    requires_db: Tests that require database
    requires_redis: Tests that require Redis
    requires_filesystem: Tests that require filesystem access

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
